[project]
name = "gaussian-dag"
version = "0.2.0"
description = "Mutual information evaluation and gradient-based optimisation for linear Gaussian directed acyclic graphs (DAGs) via the K-recursion."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Tadashi Wadayama", email = "wadayama@nitech.ac.jp" },
    { name = "Na Siqi" },
]
keywords = [
    "mutual-information",
    "gaussian-dag",
    "automatic-differentiation",
    "wirtinger-calculus",
    "mimo",
    "information-theory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.12.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/wadayama/gaussian-dag"
Repository = "https://github.com/wadayama/gaussian-dag"
Issues = "https://github.com/wadayama/gaussian-dag/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaussian_dag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
